apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: pyen/log-output:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_LOG_INTERVAL_MS
              value: "5000"