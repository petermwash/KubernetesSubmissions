apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  labels:
    app: todo-app
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: todo-app-service
                port:
                  number: 8080
            pathType: Prefix
            path: /